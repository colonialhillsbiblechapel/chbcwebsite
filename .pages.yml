# Pages CMS — the website's admin panel (https://app.pagescms.org), for volunteer editors.
# Each save is a commit to master; the site then rebuilds and goes live in a minute or two.
# Only the parts below are editable. The Doctrines & Practices, the beliefs, the gospel and history
# pages, and the hymns are deliberately left out: they are kept exactly as approved.
# The forms mirror website/src/content.config.ts; a change that doesn't fit it fails the build and
# never reaches the live site.

media:
  - name: missionaries
    label: Missionary photos
    input: website/src/assets/images/ministries
    output: ../../assets/images/ministries
    categories: [image]
    rename: safe

