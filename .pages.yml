# Pages CMS — the website's admin panel (https://app.pagescms.org), for volunteer editors.
# Written so that anyone can use it: plain questions, an example under each, choices instead of
# typing wherever possible, and nothing that can break the site. Each save is a commit to master;
# the site then rebuilds and is live in about two minutes. A change that doesn't fit the site's
# rules (website/src/content.config.ts) fails the build and never reaches the live site.
# Deliberately not editable here: the Doctrines & Practices, the beliefs, the gospel and history
# pages, and the hymns — kept exactly as approved.

media:
  - name: missionaries
    label: Missionary photos
    input: website/src/assets/images/ministries
    output: ../../assets/images/ministries
    categories: [image]
    rename: safe

