content:
  # ——— 1. The guide, read inside the editor ———
  - name: start-here
    label: Start here — how to edit
    description: A short guide to every part of the editor. Nothing here can be changed.
    type: file
    path: EDITING.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Guide
        type: rich-text
        readonly: true

  # ——— 2. Events ———
  - name: events
    label: Events
    description: Special events, shown on the homepage. When an event's day has passed it disappears from the site by itself — there is no need to delete it.
    type: collection
    path: website/src/content/events
    format: yaml
    filename: "{fields.date}-{primary}.yaml"
    operations: { rename: false }
    view:
      fields: [title, date, start]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title, summary]
    fields:
      - name: title
        label: What is the event?
        description: "For example: Men’s Breakfast & Prayer Meeting"
        type: string
        required: true
        options: { maxlength: 120 }
      - name: date
        label: Which day?
        description: Click to choose the day on the calendar.
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: start
        label: What time does it start?
        description: Leave empty if there is no set time.
        component: time
      - name: end
        label: What time does it end?
        description: Optional.
        component: time
      - name: location
        label: Where?
        description: Leave empty when it is at the chapel. For example, “Morgan House” or an address.
        type: string
      - name: endDate
        label: Last day, for an event over several days
        description: Leave empty for a one-day event.
        type: date
        default: ""
        options: { format: yyyy-MM-dd }
      - name: summary
        label: Anything else to say? (optional)
        description: One or two sentences. The day and time are already shown, so there is no need to repeat them.
        type: text
        options: { maxlength: 300 }

  # ——— 3. Sermons & videos ———
  - name: sermons
    label: Sermons & videos
    description: The media library. To add a message, copy its link on YouTube (Share, then Copy) and paste it below; the picture comes from YouTube by itself.
    type: collection
    path: website/src/content/sermons
    format: yaml
    filename: "{fields.date}-{primary}.yaml"
    operations: { rename: false }
    view:
      fields: [title, speaker, date]
      primary: title
      sort: [date, title, speaker]
      default:
        sort: date
        order: desc
      search: [title, speaker, description]
    fields:
      - name: youtube
        label: YouTube link
        description: "Paste the link, e.g. https://youtu.be/oQCGbdaure8 — older messages have none here; that is fine."
        type: string
      - name: category
        label: What kind of message is it?
        type: select
        required: true
        options:
          placeholder: Choose one
          values:
            - { name: sunday, label: Lord's Day message }
            - { name: conference, label: Houston Bible Conference }
            - { name: special, label: Special message or series }
      - name: title
        label: Title
        description: "For a conference: “106th Annual Houston Bible Conference — Sunday Afternoon — Jim Fleming”. For a Sunday: the title of the message."
        type: string
        required: true
      - name: speaker
        label: Speaker
        description: "Full name, written the same way each time, e.g. Jim Fleming."
        type: string
        required: true
      - name: date
        label: Date of the message
        description: Click to choose the day.
        type: date
        options: { format: yyyy-MM-dd }
      - name: conference
        label: Conference number (conference messages only)
        description: "The number of the Houston Bible Conference, e.g. 106. Leave empty for other messages."
        type: number
        options: { min: 1 }
      - name: series
        label: Part of a series? (optional)
        type: select
        options:
          placeholder: Not part of a series
          values:
            - { name: light-from-the-word, label: Light from the Word }
            - {
                name: doctrine-of-discipleship,
                label: Doctrine of Discipleship,
              }
      - name: episode
        label: Episode number in the series (optional)
        type: number
        options: { min: 1 }
      - name: description
        label: A sentence about it (optional)
        type: text
      - name: year
        label: Year only
        type: number
        hidden: true
      - name: slides
        label: Slides link
        type: string
        hidden: true

  # ——— 4. Meeting times ———
  - name: meetings
    label: Meeting times
    description: The regular weekly meetings, one entry per day. They appear on the homepage, the About page and at the foot of every page. Choose a day, change a time from the list, and save.
    type: collection
    path: website/src/content/meetings
    format: yaml
    filename: "{fields.day}.yaml"
    operations: { delete: false, rename: false }
    view:
      fields: [label]
      primary: label
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: day
        label: Day
        type: select
        required: true
        options:
          values:
            [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
      - name: label
        label: Heading on the site
        description: "For example: Sunday - Lord’s Day"
        type: string
        required: true
      - name: groups
        label: Meetings on this day
        description: Most days have one group. A second group is only for meetings held on one week of the month (e.g. the second Saturday).
        type: object
        list:
          min: 1
          collapsible:
            summary: "{heading}"
        fields:
          - name: items
            label: Meetings
            type: object
            list:
              min: 1
              collapsible:
                summary: "{title} — {start}"
            fields:
              - name: title
                label: Name of the meeting
                description: "For example: Breaking of Bread"
                type: string
                required: true
              - name: start
                label: Starts at
                component: time
                required: true
              - name: end
                label: Ends at (optional)
                component: time
              - name: inFooter
                label: Also list it at the foot of every page
                type: boolean
              - name: footerLabel
                label: Name at the foot of the page, if different (optional)
                description: "For example: Sunday Worship"
                type: string
          - name: heading
            label: Heading for a monthly group (optional)
            description: "Only for meetings held on one week of the month, e.g. “Second Saturday”. Leave empty otherwise."
            type: string
          - name: monthlyWeek
            label: Which week of the month? (only with a heading above)
            description: 1 = first, 2 = second … 5 = fifth. Leave empty for weekly meetings.
            type: number
            options: { min: 1, max: 5 }
      - name: online
        label: Held online (WebEx), not at the chapel
        type: boolean
      - name: order
        label: Position on the page
        description: 1 is shown first.
        type: number
        required: true
        options: { min: 1, max: 7 }

  # ——— 5. Missionaries ———
  - name: missionaries
    label: Missionaries
    description: The Ministries page, one entry per person or couple. Show someone only with their agreement (and their mission's).
    type: collection
    path: website/src/content/missionaries
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations: { rename: false }
    view:
      fields: [name, role]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name(s)
        description: "For example: Johnson & Valsa John"
        type: string
        required: true
      - name: role
        label: Their ministry, in a few words
        description: "For example: Full-time Ministry - Teaching & Pastoral Care"
        type: string
        required: true
      - name: photo
        label: Photo
        description: A clear photo, ideally wider than it is tall.
        type: image
        required: true
        options: { media: missionaries }
      - name: photoAlt
        label: Who is in the photo?
        description: Read aloud to blind visitors, e.g. “Johnson and Valsa John”.
        type: string
        required: true
      - name: body
        label: About them
        description: A few short paragraphs.
        type: rich-text
      - name: local
        label: Serving here in the Houston area
        type: boolean
      - name: website
        label: Their website (optional)
        type: object
        fields:
          - name: label
            label: Text of the link
            description: "For example: Narrow Path Ministries"
            type: string
          - name: url
            label: Web address
            description: Starting with https://
            type: string
      - name: order
        label: Position on the page
        description: 1 is shown first.
        type: number
        required: true

  # ——— 6. Helpful links ———
  - name: links
    label: Helpful links
    description: The Resources page, one entry per heading (e.g. “Spiritual Resources”), each with its links.
    type: collection
    path: website/src/content/links
    format: yaml
    filename: "{fields.order}-{primary}.yaml"
    operations: { rename: false }
    view:
      fields: [title]
      primary: title
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Heading
        description: "For example: Spiritual Resources"
        type: string
        required: true
      - name: icon
        label: Small picture beside the heading
        component: icon
        required: true
      - name: links
        label: Links under this heading
        type: object
        list:
          min: 1
          collapsible:
            summary: "{label}"
        fields:
          - name: label
            label: Name of the website
            type: string
            required: true
          - name: description
            label: One line about it
            type: string
            required: true
          - name: url
            label: Web address
            description: Copy it from the browser's address bar; it starts with https://
            type: string
            required: true
          - name: icon
            label: Small picture
            component: icon
            required: true
      - name: order
        label: Position on the page
        description: 1 is shown first.
        type: number
        required: true

  # ——— 7. Church details ———
  - name: church
    label: Church details
    description: Address, phone, email and the verse at the foot of every page. Change with care — they appear everywhere.
    type: file
    path: website/src/content/settings/site.yaml
    format: yaml
    fields:
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string, required: true }
          - { name: city, label: City, type: string, required: true }
          - { name: region, label: State, type: string, required: true }
          - { name: postalCode, label: ZIP code, type: string, required: true }
      - name: phone
        label: Phone
        description: "Written as +1 281 931 1120"
        type: string
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: footerVerse
        label: Verse at the foot of every page
        type: object
        fields:
          - {
              name: text,
              label: Words of the verse,
              type: text,
              required: true,
            }
          - {
              name: reference,
              label: Reference,
              description: "e.g. Romans 6:23",
              type: string,
              required: true,
            }
          - name: translation
            label: Translation
            type: select
            required: true
            options:
              values: [KJV, NKJV, NASB1995]
      - {
          name: name,
          label: Full name of the chapel,
          type: string,
          required: true,
        }
      - { name: shortName, label: Short name, type: string, required: true }
      - {
          name: tagline,
          label: Tagline,
          description: "e.g. Gathering in His Name Since 1975",
          type: string,
          required: true,
        }
      - {
          name: description,
          label: One sentence about the chapel,
          type: text,
          required: true,
        }
      - name: seo
        label: How the chapel appears in Google
        description: Not shown on the website itself.
        type: object
        fields:
          - name: homeTitle
            label: Title in Google (up to 65 letters)
            type: string
            required: true
            options: { maxlength: 65 }
          - name: homeDescription
            label: Description in Google (50 to 160 letters)
            type: text
            required: true
            options: { minlength: 50, maxlength: 160 }
          - name: keywords
            label: Words people search for
            type: string
            list: { min: 1 }
      - name: geo
        label: Map position
        type: object
        hidden: true
        fields:
          - { name: latitude, type: number }
          - { name: longitude, type: number }

  # ——— 8. Rarely needed ———
  - name: more
    label: Rarely needed
    type: group
    items:
      - name: series
        label: Series of messages
        description: A new series also has to be added to the choices on a message — ask the web team.
        type: collection
        path: website/src/content/series
        format: yaml
        operations: { delete: false, rename: false }
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: credit
            label: From another YouTube channel? (optional)
            type: object
            fields:
              - name: name
                label: Channel name
                type: string
              - name: url
                label: Channel link (https://…)
                type: string
      - name: hidden-videos
        label: Videos left off the site
        description: Videos on the chapel's YouTube channel that shouldn't appear on the website, e.g. a full live stream when each message is also posted on its own.
        type: file
        path: website/src/content/hidden-videos.yaml
        format: yaml
        list: true
        fields:
          - name: id
            label: YouTube video ID
            description: The 11 letters and numbers after watch?v= or youtu.be/ in the video's link.
            type: string
            required: true
          - name: note
            label: Why it is left off
            type: string
            required: true
