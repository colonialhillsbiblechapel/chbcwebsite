content:
  - name: gatherings
    label: Meetings & Events
    type: group
    items:
      - name: events
        label: Upcoming events
        description: Special events. Each shows on the homepage until its day has passed, then disappears by itself.
        type: collection
        path: website/src/content/events
        format: yaml
        filename: '{fields.date}-{primary}.yaml'
        view:
          fields: [title, date, start]
          primary: title
          sort: [date, title]
          default:
            sort: date
            order: desc
          search: [title, summary]
        fields:
          - name: title
            label: Title
            type: string
            required: true
            options: { maxlength: 120 }
          - name: date
            label: Date
            type: date
            required: true
            options: { format: yyyy-MM-dd }
          - name: endDate
            label: Last day (for an event over several days)
            type: date
            default: ''
            options: { format: yyyy-MM-dd }
          - name: start
            label: Starts at
            component: time
          - name: end
            label: Ends at
            component: time
          - name: location
            label: Where (leave empty when it is at the chapel)
            type: string
          - name: summary
            label: One or two sentences about it
            type: text
            options: { maxlength: 300 }

      - name: meetings
        label: Weekly meetings
        description: The regular meetings, one per day. They feed the homepage, the About page, the footer and the "next meeting" notice.
        type: collection
        path: website/src/content/meetings
        format: yaml
        filename: '{fields.day}.yaml'
        view:
          fields: [label, order]
          primary: label
          sort: [order]
          default:
            sort: order
            order: asc
        fields:
          - name: day
            label: Day
            type: select
            required: true
            options:
              values: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
          - name: label
            label: Heading shown on the site
            type: string
            required: true
          - name: order
            label: Order on the page (1 comes first)
            type: number
            required: true
            options: { min: 1, max: 7 }
          - name: online
            label: Held online (WebEx), not at the chapel
            type: boolean
          - name: groups
            label: Meetings on this day
            type: object
            list:
              min: 1
              collapsible:
                summary: '{heading}'
            fields:
              - name: heading
                label: Heading (only for a group held on one week of the month, e.g. "Second Saturday")
                type: string
              - name: monthlyWeek
                label: Held only on this week of the month (1 to 5; leave empty when weekly)
                type: number
                options: { min: 1, max: 5 }
              - name: items
                label: Meetings
                type: object
                list:
                  min: 1
                  collapsible:
                    summary: '{title}'
                fields:
                  - name: start
                    label: Starts at
                    component: time
                    required: true
                  - name: end
                    label: Ends at
                    component: time
                  - name: title
                    label: Name of the meeting
                    type: string
                    required: true
                  - name: inFooter
                    label: Show in the footer's service times
                    type: boolean
                  - name: footerLabel
                    label: Name in the footer (if different)
                    type: string

  - name: messages
    label: Messages
    type: group
    items:
      - name: sermons
        label: Recorded messages
        description: The media library. Add a message with its YouTube link; its picture is taken from YouTube by itself.
        type: collection
        path: website/src/content/sermons
        format: yaml
        filename: '{fields.date}-{primary}.yaml'
        view:
          fields: [title, speaker, date, category]
          primary: title
          sort: [date, title, speaker]
          default:
            sort: date
            order: desc
          search: [title, speaker, description]
        fields:
          - name: youtube
            label: YouTube link
            description: Paste the video's link from YouTube (Share, then Copy). Messages added before the admin panel are known by their file name and have no link here.
            type: string
          - name: title
            label: Title
            description: 'As on the site, e.g. "106th Annual Houston Bible Conference — Sunday Afternoon — Jim Fleming".'
            type: string
            required: true
          - name: speaker
            label: Speaker
            type: string
            required: true
          - name: date
            label: Date of the message
            type: date
            options: { format: yyyy-MM-dd }
          - name: category
            label: Kind of message
            type: select
            required: true
            options:
              values:
                - { name: sunday, label: Lord's Day message }
                - { name: conference, label: Houston Bible Conference }
                - { name: special, label: Special or series }
          - name: conference
            label: Conference number (e.g. 106) — conference messages only
            type: number
          - name: series
            label: Series (only for a message in a series)
            type: select
            options:
              values:
                - { name: light-from-the-word, label: Light from the Word }
                - { name: doctrine-of-discipleship, label: Doctrine of Discipleship }
          - name: episode
            label: Episode number in the series
            type: number
            options: { min: 1 }
          - name: year
            label: Year only (when the exact date isn't known)
            type: number
          - name: description
            label: A sentence about it
            type: text
          - name: slides
            label: Link to the slides (if any)
            type: string

      - name: series
        label: Series
        description: Series of messages. A new series also needs adding to the Series choices of a message (ask the web team).
        type: collection
        path: website/src/content/series
        format: yaml
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: credit
            label: From another YouTube channel (credited on the site)
            type: object
            fields:
              - name: name
                label: Channel name
                type: string
              - name: url
                label: Channel link
                type: string

      - name: hidden-videos
        label: Videos left off the site
        description: Videos on the chapel's YouTube channel that shouldn't appear on the website (e.g. full live streams when each message is posted separately).
        type: file
        path: website/src/content/hidden-videos.yaml
        format: yaml
        list: true
        fields:
          - name: id
            label: YouTube video ID (the 11 letters after watch?v= or youtu.be/)
            type: string
            required: true
          - name: note
            label: Why it is left off
            type: string
            required: true

  - name: ministries
    label: Missionaries
    description: The Ministries page, one person or couple each.
    type: collection
    path: website/src/content/missionaries
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [name, role, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name(s)
        type: string
        required: true
      - name: role
        label: Ministry
        type: string
        required: true
      - name: order
        label: Order on the page (1 comes first)
        type: number
        required: true
      - name: local
        label: Serving here in the Houston area
        type: boolean
      - name: photo
        label: Photo
        description: Only with their (and their mission's) agreement to be shown.
        type: image
        required: true
        options: { media: missionaries }
      - name: photoAlt
        label: Who is in the photo (for blind visitors)
        type: string
        required: true
      - name: website
        label: Their website (optional)
        type: object
        fields:
          - name: label
            label: Link text
            type: string
          - name: url
            label: Link
            type: string
      - name: body
        label: About them
        type: rich-text

  - name: resources
    label: Helpful links
    description: The Resources page, one category each.
    type: collection
    path: website/src/content/links
    format: yaml
    filename: '{fields.order}-{primary}.yaml'
    view:
      fields: [title, order]
      primary: title
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: Order on the page (1 comes first)
        type: number
        required: true
      - name: title
        label: Category
        type: string
        required: true
      - name: icon
        label: Icon
        component: icon
        required: true
      - name: links
        label: Links
        type: object
        list:
          min: 1
          collapsible:
            summary: '{label}'
        fields:
          - name: label
            label: Name
            type: string
            required: true
          - name: description
            label: One line about it
            type: string
            required: true
          - name: url
            label: Link (starting https://)
            type: string
            required: true
          - name: icon
            label: Icon
            component: icon
            required: true

  - name: church
    label: Church details
    description: Name, address, phone, email and the footer verse. Used on every page and by search engines.
    type: file
    path: website/src/content/settings/site.yaml
    format: yaml
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: shortName, label: Short name, type: string, required: true }
      - { name: tagline, label: Tagline, type: string, required: true }
      - { name: description, label: One-sentence description, type: text, required: true }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string, required: true }
          - { name: city, label: City, type: string, required: true }
          - { name: region, label: State, type: string, required: true }
          - { name: postalCode, label: ZIP code, type: string, required: true }
      - { name: phone, label: Phone, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - name: footerVerse
        label: Verse in the footer
        type: object
        fields:
          - { name: text, label: Verse, type: text, required: true }
          - { name: reference, label: Reference, type: string, required: true }
          - name: translation
            label: Translation
            type: select
            required: true
            options:
              values: [KJV, NKJV, NASB1995]
      - name: geo
        label: Map position (for directions)
        type: object
        fields:
          - { name: latitude, label: Latitude, type: number, required: true }
          - { name: longitude, label: Longitude, type: number, required: true }
      - name: seo
        label: How the chapel appears in Google
        type: object
        fields:
          - name: homeTitle
            label: Title in search results (up to 65 letters)
            type: string
            required: true
            options: { maxlength: 65 }
          - name: homeDescription
            label: Description in search results (50 to 160 letters)
            type: text
            required: true
            options: { minlength: 50, maxlength: 160 }
          - name: keywords
            label: Search words
            type: string
            list: { min: 1 }
