# Proposes updates (as pull requests) when the GitHub Actions or the website's npm packages get
# new releases or security fixes. Minor and patch updates are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
