# Builds website/ and publishes it to GitHub Pages.
# Activates at launch: merge to master, then set Settings → Pages → Source to "GitHub Actions".
# Scheduled runs rebuild the site so past events drop off and new YouTube messages appear by
# themselves: every night, and on Sunday afternoon after the morning's ministry is uploaded.
name: Deploy website

on:
  push:
    branches: [master]
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC = shortly after midnight in Houston (CST/CDT)
    - cron: "0 20 * * 0" # Sunday 20:00 UTC = early afternoon in Houston
  workflow_dispatch:

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Actions are pinned to exact commits (their release is in the comment), so a moved tag can
      # never change what runs. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: ./website
          node-version: 24
          # `npm run build` fails (and nothing is published) if the third-party or license checks fail.
          build-cmd: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
