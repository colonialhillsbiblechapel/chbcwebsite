order: 9
statement: 'We believe the Bible teaches two ordinances for the church, the baptism of believers in water by immersion, and the Lord’s Supper for believers, which is remembered each Lord’s Day.'
references:
  - 'Matthew 28:19'
  - 'Acts 8:35-38'
  - 'Acts 20:7'
  - 'Matthew 26:26-28'
  - 'I Corinthians 11:23-26'
