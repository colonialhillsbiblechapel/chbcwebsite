order: 5
statement: 'We believe that on the cross of Calvary, Jesus Christ wholly and eternally paid the penalty for sin, and was raised from the dead, according to the Scriptures, and that any person who in faith rests upon the finished work of Christ immediately enters into its benefit to the present and eternal salvation of his/her soul.'
references:
  - 'I Corinthians 15:1-4'
  - 'Romans 5:6,8'
  - 'John 5:24'
  - 'Hebrews 5:9'
  - 'John 10:28-30'
